stages:
  - build
  - docker-push
  - deploy

variables:
  DOCKER_IMAGE_NAME: nadhif21/accommodation-fe
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA

build:
  stage: build
  image: node:20
  cache:
    paths:
      - node_modules
  script:
    - npm ci
    - npm run build
  artifacts:
    paths:
      - dist
      - Dockerfile
      - k8s/deployment.yaml
      - k8s/service.yaml
      - k8s/ingress.yaml
    expire_in: 1 hour
  only:
    - feat/praktikum-9

docker-push:
  stage: docker-push
  image: docker:24
  services:
    - name: docker:24-dind
      command: ["--insecure-registry", "registry-1.docker.io"]
  dependencies:
    - build
  before_script:
    - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
  script:
    - docker build -t $DOCKER_IMAGE_NAME:$IMAGE_TAG .
    - docker push $DOCKER_IMAGE_NAME:$IMAGE_TAG
    - echo $IMAGE_TAG > image_tag.txt
  artifacts:
    paths:
      - image_tag.txt
    expire_in: 1 hour
  only:
    - feat/praktikum-9

deploy:
  stage: deploy
  image: alpine:latest
  dependencies:
    - docker-push
  before_script:
    - apk add --no-cache openssh bash
    - mkdir -p ~/.ssh
    - echo "$EC2_SSH_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
  script:
    - IMAGE_TAG=$(cat image_tag.txt)
    - sed "s|REPLACE_ME_TAG|$IMAGE_TAG|g" k8s/deployment.yaml > deployment.yaml
    - echo "Creating -> deployment.yaml, service.yaml, ingress.yaml"
    - ssh $EC2_USER@$EC2_HOST "mkdir -p ~/app/accommodation-fe/k8s"
    - scp deployment.yaml k8s/service.yaml k8s/ingress.yaml $EC2_USER@$EC2_HOST:~/app/accommodation-fe/k8s/
    - |
      ssh $EC2_USER@$EC2_HOST "
        sudo k3s kubectl apply -f ~/app/accommodation-fe/k8s/ &&
        sudo k3s kubectl rollout status deployment/accommodation-fe -n default
      "
  only:
    - feat/praktikum-9