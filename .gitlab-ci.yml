stages:
  - build
  - docker-push
  - deploy

variables:
  DOCKER_IMAGE_NAME: nadhif21/accommodation-be
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=false"

build:
  stage: build
  image: eclipse-temurin:21-jdk
  cache:
    paths:
      - .gradle/wrapper
      - .gradle/caches
  script:
    - chmod +x ./gradlew
    # Set environment variables untuk timeout lebih lama
    - export GRADLE_OPTS="$GRADLE_OPTS -Dorg.gradle.internal.http.connectionTimeout=120000 -Dorg.gradle.internal.http.socketTimeout=120000"
    # Retry mechanism dengan max 3 attempts
    - |
      MAX_RETRIES=3
      RETRY_COUNT=0
      while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
        echo "Attempt $((RETRY_COUNT + 1)) of $MAX_RETRIES"
        if ./gradlew clean build -x test --no-daemon --refresh-dependencies; then
          echo "Build successful!"
          break
        else
          RETRY_COUNT=$((RETRY_COUNT + 1))
          if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
            echo "Build failed, waiting 15 seconds before retry..."
            sleep 15
          else
            echo "Build failed after $MAX_RETRIES attempts"
            exit 1
          fi
        fi
      done
    - cp $(find build/libs -name "*.jar" | head -n 1) app.jar
  artifacts:
    paths:
      - app.jar
      - Dockerfile
      - k8s/deployment.yaml
      - k8s/service.yaml
    expire_in: 1 hour
  only:
    - feat/praktikum-9

docker-push:
  stage: docker-push
  image: docker:24
  services:
    - name: docker:24-dind
      command: ["--insecure-registry", "registry-1.docker.io"]
  dependencies:
    - build
  before_script:
    - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
  script:
    - docker build -t $DOCKER_IMAGE_NAME:$IMAGE_TAG .
    - docker push $DOCKER_IMAGE_NAME:$IMAGE_TAG
    - echo $IMAGE_TAG > image_tag.txt
  artifacts:
    paths:
      - image_tag.txt
    expire_in: 1 hour
  only:
    - feat/praktikum-9

deploy:
  stage: deploy
  image: alpine:latest
  dependencies:
    - docker-push
  before_script:
    - apk add --no-cache openssh bash
    - mkdir -p ~/.ssh
    - echo "$EC2_SSH_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
  script:
    - echo "Generating Kubernetes ConfigMap & Secret via printf..."
    - |
      printf "apiVersion: v1\nkind: ConfigMap\nmetadata:\n  name: accommodation-be-config\n  namespace: default\ndata:\n  DATABASE_URL_PROD: \"%s\"\n  DATABASE_USERNAME: \"%s\"\n" \
      "$DATABASE_URL_PROD_1" "$DATABASE_USERNAME" > configmap.yaml
    - |
      printf "apiVersion: v1\nkind: Secret\nmetadata:\n  name: accommodation-be-secret\n  namespace: default\ntype: Opaque\nstringData:\n  DATABASE_PASSWORD: \"%s\"\n  JWT_SECRET_KEY: \"%s\"\n  CORS_ALLOWED_ORIGINS: \"%s\"\n" \
      "$DATABASE_PASSWORD" "$JWT_SECRET_KEY" "$CORS_ALLOWED_ORIGINS" > secret.yaml
    - sed "s|REPLACE_ME_TAG|$IMAGE_TAG|g" k8s/deployment.yaml > deployment.yaml
    - echo "Creating -> deployment.yaml, configmap.yaml, secret.yaml, service.yaml, ingress.yaml"
    - ssh $EC2_USER@$EC2_HOST "mkdir -p ~/app/accommodation-be/k8s"
    - scp deployment.yaml configmap.yaml secret.yaml k8s/service.yaml k8s/ingress.yaml $EC2_USER@$EC2_HOST:~/app/accommodation-be/k8s/
    - |
      ssh $EC2_USER@$EC2_HOST "
        sudo k3s kubectl apply -f ~/app/accommodation-be/k8s/ &&
        sudo k3s kubectl rollout status deployment/accommodation-be -n default
      "
  only:
    - feat/praktikum-9



