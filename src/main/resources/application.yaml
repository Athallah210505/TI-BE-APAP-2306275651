server:
  port: 8080

spring:
  application:
    name: accommodation-2306275651-be
  mvc:
    hiddenmethod:
      filter:
        enabled: true
  profiles:
    active: 'dev'
  main:
    allow-circular-references: true
  jpa:
    hibernate:
      ddl-auto: create-drop

accommodation-be:
  app:
    jwtSecret: "${JWT_SECRET_KEY}"
    jwtExpirationMs: 86400000

# CORS configuration
CORS_ALLOWED_ORIGINS: "*"

external:
  accommodation-be-url: "http://localhost:8080"
